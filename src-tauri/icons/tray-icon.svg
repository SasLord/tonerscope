<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 22 22" width="22" height="22">
  <!--
    TonerScope tray icon — 22×22 монохромная
    Используется как:
      src-tauri/icons/tray-icon.png  (конвертировать из этого SVG)

    Для светлой системной панели: fill="#000000"
    Для тёмной системной панели:  fill="#ffffff"
    По умолчанию ниже — белая (тёмный трей, наиболее распространён).
    Если нужна чёрная версия — замени все #ffffff на #000000.
  -->

  <!-- outer ring -->
  <circle cx="11" cy="11" r="9" fill="none" stroke="#ffffff" stroke-width="1.2" opacity="0.5"/>
  <!-- inner aiming ring -->
  <circle cx="11" cy="11" r="5.5" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.7"/>
  <!-- center dot -->
  <circle cx="11" cy="11" r="1.2" fill="#ffffff"/>

  <!-- crosshair top -->
  <line x1="11" y1="2"  x2="11" y2="5.5" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round"/>
  <!-- crosshair bottom -->
  <line x1="11" y1="16.5" x2="11" y2="20" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round"/>
  <!-- crosshair left -->
  <line x1="2"  y1="11" x2="5.5" y2="11" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round"/>
  <!-- crosshair right -->
  <line x1="16.5" y1="11" x2="20" y2="11" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round"/>

  <!-- toner cartridge body -->
  <rect x="7" y="8.2" width="9.5" height="4.5" rx="1.2" fill="none" stroke="#ffffff" stroke-width="1"/>
  <!-- toner level fill ~70% -->
  <rect x="8" y="9.2" width="5" height="2.5" rx="0.8" fill="#ffffff" opacity="0.9"/>
</svg>
