<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">

  <!-- background — скруглённый квадрат под все платформы -->
  <rect width="1024" height="1024" rx="200" fill="#0d0f12"/>

  <!-- outer decorative ring -->
  <circle cx="512" cy="512" r="400" fill="none" stroke="#00d4aa" stroke-width="18" opacity="0.18"/>
  <!-- secondary ring -->
  <circle cx="512" cy="512" r="310" fill="none" stroke="#00d4aa" stroke-width="10" opacity="0.12"/>
  <!-- aiming ring -->
  <circle cx="512" cy="512" r="230" fill="none" stroke="#00d4aa" stroke-width="8" opacity="0.45"/>

  <!-- center dot -->
  <circle cx="512" cy="512" r="20" fill="#00d4aa"/>
  <!-- center ring -->
  <circle cx="512" cy="512" r="38" fill="none" stroke="#00d4aa" stroke-width="4" opacity="0.6"/>

  <!-- crosshair — top -->
  <line x1="512" y1="112" x2="512" y2="282" stroke="#00d4aa" stroke-width="20" stroke-linecap="round"/>
  <!-- crosshair — bottom (gap for cartridge) -->
  <line x1="512" y1="742" x2="512" y2="880" stroke="#00d4aa" stroke-width="20" stroke-linecap="round"/>
  <!-- crosshair — left -->
  <line x1="112" y1="512" x2="282" y2="512" stroke="#00d4aa" stroke-width="20" stroke-linecap="round"/>
  <!-- crosshair — right -->
  <line x1="742" y1="512" x2="912" y2="512" stroke="#00d4aa" stroke-width="20" stroke-linecap="round"/>

  <!-- tick marks at 45° — outer ring -->
  <line x1="512" y1="112" x2="512" y2="148" stroke="#00d4aa" stroke-width="10" opacity="0.35" transform="rotate(45 512 512)"/>
  <line x1="512" y1="112" x2="512" y2="148" stroke="#00d4aa" stroke-width="10" opacity="0.35" transform="rotate(135 512 512)"/>
  <line x1="512" y1="112" x2="512" y2="148" stroke="#00d4aa" stroke-width="10" opacity="0.35" transform="rotate(225 512 512)"/>
  <line x1="512" y1="112" x2="512" y2="148" stroke="#00d4aa" stroke-width="10" opacity="0.35" transform="rotate(315 512 512)"/>

  <!-- tick marks at 45° — inner ring -->
  <line x1="512" y1="282" x2="512" y2="308" stroke="#00d4aa" stroke-width="7" opacity="0.25" transform="rotate(45 512 512)"/>
  <line x1="512" y1="282" x2="512" y2="308" stroke="#00d4aa" stroke-width="7" opacity="0.25" transform="rotate(135 512 512)"/>
  <line x1="512" y1="282" x2="512" y2="308" stroke="#00d4aa" stroke-width="7" opacity="0.25" transform="rotate(225 512 512)"/>
  <line x1="512" y1="282" x2="512" y2="308" stroke="#00d4aa" stroke-width="7" opacity="0.25" transform="rotate(315 512 512)"/>

  <!-- toner cartridge body -->
  <rect x="338" y="468" width="348" height="130" rx="22" fill="#1d2229" stroke="#00d4aa" stroke-width="10"/>

  <!-- cartridge nozzle (right side) -->
  <rect x="660" y="494" width="52" height="78" rx="14" fill="#242b33" stroke="#00d4aa" stroke-width="7"/>

  <!-- toner level track (background) -->
  <rect x="360" y="488" width="280" height="48" rx="12" fill="#0d0f12"/>

  <!-- toner level fill — 72% -->
  <rect x="360" y="488" width="202" height="48" rx="12" fill="#00d4aa" opacity="0.92"/>

  <!-- level dots row below bar -->
  <circle cx="370" cy="556" r="7" fill="#00d4aa" opacity="0.25"/>
  <circle cx="396" cy="556" r="7" fill="#00d4aa" opacity="0.35"/>
  <circle cx="422" cy="556" r="7" fill="#00d4aa" opacity="0.55"/>
  <circle cx="448" cy="556" r="7" fill="#00d4aa" opacity="0.75"/>
  <circle cx="474" cy="556" r="7" fill="#00d4aa" opacity="0.90"/>
  <circle cx="500" cy="556" r="7" fill="#00d4aa"/>
  <circle cx="526" cy="556" r="7" fill="#00d4aa" opacity="0.25"/>
  <circle cx="552" cy="556" r="7" fill="#00d4aa" opacity="0.12"/>
  <circle cx="578" cy="556" r="7" fill="#00d4aa" opacity="0.08"/>
  <circle cx="604" cy="556" r="7" fill="#00d4aa" opacity="0.06"/>

</svg>
