# .github/workflows/release.yml
name: Release TonerScope

on:
  push:
    tags:
      - 'v*'   # Triggered by: git tag v0.1.0 && git push --tags

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create-release.outputs.result }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create GitHub Release (draft)
        id: create-release
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              tag_name:   context.ref.replace('refs/tags/', ''),
              name:       `TonerScope ${context.ref.replace('refs/tags/', '')}`,
              body:       '## Changes\n\nSee [CHANGELOG.md](CHANGELOG.md) for details.',
              draft:      true,
              prerelease: false,
            });
            return data.id;

  build-and-upload:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux: .deb + .AppImage
          - platform: ubuntu-22.04
            args: ''
            label: linux

          # macOS ARM (M1/M2/M3)
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
            label: macos-arm

          # macOS Intel
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
            label: macos-x86

          # Windows: .msi + NSIS setup
          - platform: windows-latest
            args: ''
            label: windows

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libssl-dev

      - run: npm ci

      - name: Build and upload release assets
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args:      ${{ matrix.args }}

  # Windows portable build (zip of the binary only)
  windows-portable:
    needs: create-release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - run: npm ci

      - run: npm run build

      - name: Build portable exe
        run: cargo build --release --manifest-path src-tauri/Cargo.toml

      - name: Package portable zip
        shell: powershell
        run: |
          mkdir portable
          copy src-tauri\target\release\tonerscope.exe portable\TonerScope.exe
          Compress-Archive -Path portable\* -DestinationPath TonerScope-portable-windows.zip

      - name: Upload portable to release
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            await github.rest.repos.uploadReleaseAsset({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              release_id: ${{ needs.create-release.outputs.release_id }},
              name: 'TonerScope-portable-windows.zip',
              data: fs.readFileSync('TonerScope-portable-windows.zip'),
            });

  publish-release:
    needs: [create-release, build-and-upload, windows-portable]
    runs-on: ubuntu-latest
    steps:
      - name: Publish release
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.updateRelease({
              owner:      context.repo.owner,
              repo:       context.repo.repo,
              release_id: ${{ needs.create-release.outputs.release_id }},
              draft:      false,
            });
